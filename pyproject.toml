[tool.poetry]
name = "dp-core"
version = "1.0.0"
description = "Reflective cognition substrate — Empirical Research Program"
authors = ["DP-Core Substrate Team"]

packages = [
    { include = "bootstrap" },
    { include = "cognition" },
    { include = "config" },
    { include = "flows" },
    { include = "interfaces" },
    { include = "market" },
    { include = "memory" },
    { include = "orchestration" },
    { include = "telemetry" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pydantic = ">=2.7.0,<3.0.0"
pydantic-settings = ">=2.2.1,<3.0.0"
sqlalchemy = ">=2.0.30,<3.0.0"
psycopg2-binary = ">=2.9.9,<3.0.0"
neo4j = ">=5.20.0,<6.0.0"
duckdb = ">=1.0.0,<2.0.0"
ollama = ">=0.2.1,<1.0.0"
pandas = ">=2.2.2,<3.0.0"
yfinance = ">=0.2.36,<1.0.0"
matplotlib = ">=3.8.0,<4.0.0"
pyarrow = ">=16.0.0,<25.0.0"
jinja2 = ">=3.1.4,<4.0.0"
pyyaml = ">=6.0.0,<7.0.0"
scikit-learn = ">=1.4.0,<2.0.0"
scipy = ">=1.13.0,<2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0,<9.0.0"
black = ">=24.4.0,<25.0.0"
isort = ">=5.13.0,<6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "requires_postgres: tests requiring a live PostgreSQL database connection",
    "requires_ollama: tests requiring a live Ollama LLM service",
]
